<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media Island Neon Edge Glow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Ambient Blackout / Screen Sleep Layer */
    #blackoutLayer {
      position: fixed;
      inset: 0;
      background: transparent;
      opacity: 0;
      transition: opacity 600ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 600ms ease;
      z-index: 1;
      pointer-events: none;
    }

    #blackoutLayer.active {
      background: #000000;
      opacity: 1;
    }

    /* Blackout Sleep Info HUD (faintly appears in dark mode) */
    .sleep-hud {
      position: absolute;
      bottom: 24px;
      right: 28px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 500ms ease;
      z-index: 5;
    }

    #blackoutLayer.active .sleep-hud {
      opacity: 1;
    }

    .sleep-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--glow-accent, #00f0ff);
      box-shadow: 0 0 8px var(--glow-accent, #00f0ff);
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Neon Perimeter Edge Glow Container */
    #glowContainer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 500ms ease, filter 300ms ease;
    }

    #glowContainer.enabled {
      opacity: 1;
    }

    /* Core edge lighting layers */
    .edge {
      position: absolute;
      pointer-events: none;
    }

    /* Top Edge */
    .edge-top {
      top: 0;
      left: 0;
      right: 0;
      height: var(--glow-depth, 70px);
      background: linear-gradient(to bottom, var(--edge-top-color, rgba(0, 240, 255, 0.95)) 0%, transparent 100%);
      filter: blur(var(--glow-blur, 16px));
      transform-origin: top center;
    }

    /* Bottom Edge */
    .edge-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--glow-depth, 70px);
      background: linear-gradient(to top, var(--edge-bottom-color, rgba(255, 140, 0, 0.95)) 0%, transparent 100%);
      filter: blur(var(--glow-blur, 16px));
      transform-origin: bottom center;
    }

    /* Left Edge */
    .edge-left {
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--glow-depth, 70px);
      background: linear-gradient(to right, var(--edge-left-color, rgba(181, 55, 242, 0.95)) 0%, transparent 100%);
      filter: blur(var(--glow-blur, 16px));
      transform-origin: center left;
    }

    /* Right Edge */
    .edge-right {
      top: 0;
      bottom: 0;
      right: 0;
      width: var(--glow-depth, 70px);
      background: linear-gradient(to left, var(--edge-right-color, rgba(0, 210, 255, 0.95)) 0%, transparent 100%);
      filter: blur(var(--glow-blur, 16px));
      transform-origin: center right;
    }

    /* Luminous razor-thin outer border line */
    .edge-border-line {
      position: absolute;
      inset: 0;
      border: 3.5px solid transparent;
      border-image-slice: 1;
      border-image-source: var(--border-gradient, linear-gradient(135deg, #7928ca 0%, #00f0ff 35%, #0070f3 60%, #ff8a3d 85%, #ff2a6d 100%));
      box-shadow: var(--edge-box-shadow, 
        inset 0 0 25px rgba(0, 240, 255, 0.6),
        inset 0 0 50px rgba(181, 55, 242, 0.4),
        inset 0 0 85px rgba(255, 138, 61, 0.35)
      );
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
    }

    /* Secondary deep ambient spread */
    .edge-deep-spread {
      position: absolute;
      inset: 0;
      box-shadow: var(--deep-spread,
        inset 0 0 60px 15px rgba(0, 240, 255, 0.4),
        inset 0 0 110px 25px rgba(181, 55, 242, 0.25),
        inset 0 0 160px 40px rgba(255, 140, 0, 0.2)
      );
      mix-blend-mode: screen;
      filter: blur(12px);
    }

    /* Music Beat Pulse Animation */
    .pulse-beat {
      animation: beatPulse 1.8s infinite ease-in-out;
    }

    @keyframes beatPulse {
      0% {
        filter: brightness(0.85) contrast(1.05);
        opacity: 0.7;
      }
      35% {
        filter: brightness(1.35) contrast(1.15) saturate(1.2);
        opacity: 1.0;
        transform: scale(1.002);
      }
      65% {
        filter: brightness(0.95) contrast(1.08);
        opacity: 0.8;
      }
      85% {
        filter: brightness(1.2) contrast(1.1);
        opacity: 0.95;
      }
      100% {
        filter: brightness(0.85) contrast(1.05);
        opacity: 0.7;
      }
    }

    /* Fast rhythmic kick when a beat is detected or triggered */
    .beat-kick {
      animation: kickInstant 320ms cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    @keyframes kickInstant {
      0% {
        filter: brightness(1.7) contrast(1.3) saturate(1.4);
        opacity: 1.0;
        transform: scale(1.006);
      }
      100% {
        filter: brightness(1.0);
        opacity: var(--base-opacity, 0.85);
        transform: scale(1);
      }
    }

    /* Gentle Breathing when music is paused */
    .pulse-idle {
      animation: breatheSmooth 4.5s infinite ease-in-out;
    }

    @keyframes breatheSmooth {
      0%, 100% {
        opacity: 0.35;
        filter: brightness(0.7) blur(2px);
      }
      50% {
        opacity: 0.65;
        filter: brightness(1.0) blur(0px);
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Screen Sleep / Blackout Backdrop -->
  <div id="blackoutLayer">
    <div class="sleep-hud">
      <span class="sleep-dot"></span>
      <span id="sleepHudText">Ambient Sleep Glow • Music Playing</span>
    </div>
  </div>

  <!-- Fullscreen Neon Perimeter Glow -->
  <div id="glowContainer">
    <div class="edge edge-top"></div>
    <div class="edge edge-bottom"></div>
    <div class="edge edge-left"></div>
    <div class="edge edge-right"></div>
    <div class="edge-border-line"></div>
    <div class="edge-deep-spread"></div>
  </div>

  <script>
    const blackoutLayer = document.getElementById("blackoutLayer");
    const glowContainer = document.getElementById("glowContainer");
    const sleepHudText = document.getElementById("sleepHudText");

    let glowConfig = {
      enabled: true,
      mode: "aurora", // "aurora" (uploaded image exact), "accent", "cyan", "pink", "sunset", "emerald", "custom"
      customColor: "#00f0ff",
      brightness: 100,
      sleepBlackout: false,
      pulseStyle: "beat" // "beat", "breathe", "static"
    };

    let currentAccent = "#00f0ff";
    let isPlaying = false;
    let beatInterval = null;

    // Apply color schemes
    function applyGlowTheme() {
      const mode = glowConfig.mode || "aurora";
      const brightness = (glowConfig.brightness || 100) / 100;
      glowContainer.style.setProperty("--base-opacity", String(0.85 * brightness));

      if (mode === "aurora") {
        // Matches the exact photo: Cyan/Blue top-right, Purple/Magenta top-left, Orange/Gold bottom
        glowContainer.style.setProperty("--edge-top-color", `rgba(0, 240, 255, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-right-color", `rgba(0, 210, 255, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-left-color", `rgba(181, 55, 242, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-bottom-color", `rgba(255, 140, 0, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--border-gradient", "linear-gradient(135deg, #9b51e0 0%, #00f0ff 30%, #0070f3 55%, #ff8a3d 80%, #ff2a6d 100%)");
        glowContainer.style.setProperty("--edge-box-shadow", `
          inset 0 0 25px rgba(0, 240, 255, ${0.7 * brightness}),
          inset 0 0 55px rgba(181, 55, 242, ${0.5 * brightness}),
          inset 0 0 95px rgba(255, 138, 61, ${0.45 * brightness})
        `);
        glowContainer.style.setProperty("--deep-spread", `
          inset 0 0 60px 15px rgba(0, 240, 255, ${0.4 * brightness}),
          inset 0 0 110px 25px rgba(181, 55, 242, ${0.3 * brightness}),
          inset 0 0 160px 40px rgba(255, 140, 0, ${0.25 * brightness})
        `);
        document.documentElement.style.setProperty("--glow-accent", "#00f0ff");
      } else {
        let baseColor = currentAccent;
        if (mode === "cyan") baseColor = "#00f0ff";
        else if (mode === "pink") baseColor = "#ff2a6d";
        else if (mode === "sunset") baseColor = "#ff8a3d";
        else if (mode === "emerald") baseColor = "#05ffa1";
        else if (mode === "purple") baseColor = "#b537f2";
        else if (mode === "custom" && glowConfig.customColor) baseColor = glowConfig.customColor;

        glowContainer.style.setProperty("--edge-top-color", `${baseColor}${Math.round(230 * brightness).toString(16).padStart(2, '0')}`);
        glowContainer.style.setProperty("--edge-right-color", `${baseColor}${Math.round(210 * brightness).toString(16).padStart(2, '0')}`);
        glowContainer.style.setProperty("--edge-left-color", `${baseColor}${Math.round(210 * brightness).toString(16).padStart(2, '0')}`);
        glowContainer.style.setProperty("--edge-bottom-color", `${baseColor}${Math.round(240 * brightness).toString(16).padStart(2, '0')}`);
        glowContainer.style.setProperty("--border-gradient", `linear-gradient(135deg, ${baseColor} 0%, #ffffff 50%, ${baseColor} 100%)`);
        glowContainer.style.setProperty("--edge-box-shadow", `
          inset 0 0 30px ${baseColor}${Math.round(180 * brightness).toString(16).padStart(2, '0')},
          inset 0 0 70px ${baseColor}${Math.round(120 * brightness).toString(16).padStart(2, '0')},
          inset 0 0 120px ${baseColor}${Math.round(80 * brightness).toString(16).padStart(2, '0')}
        `);
        glowContainer.style.setProperty("--deep-spread", `
          inset 0 0 70px 20px ${baseColor}${Math.round(90 * brightness).toString(16).padStart(2, '0')},
          inset 0 0 140px 40px ${baseColor}${Math.round(50 * brightness).toString(16).padStart(2, '0')}
        `);
        document.documentElement.style.setProperty("--glow-accent", baseColor);
      }
    }

    function updateState(config) {
      if (!config) return;
      glowConfig = Object.assign(glowConfig, config);

      if (glowConfig.enabled) {
        glowContainer.classList.add("enabled");
      } else {
        glowContainer.classList.remove("enabled");
      }

      if (glowConfig.sleepBlackout) {
        blackoutLayer.classList.add("active");
      } else {
        blackoutLayer.classList.remove("active");
      }

      applyGlowTheme();
      updateAnimationState();
    }

    function triggerBeatKick() {
      if (!glowConfig.enabled) return;
      glowContainer.classList.remove("beat-kick");
      void glowContainer.offsetWidth; // Force reflow
      glowContainer.classList.add("beat-kick");
    }

    function updateAnimationState() {
      if (!glowConfig.enabled) {
        glowContainer.classList.remove("pulse-beat", "pulse-idle", "beat-kick");
        if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
        return;
      }

      if (isPlaying) {
        glowContainer.classList.remove("pulse-idle");
        glowContainer.classList.add("pulse-beat");
        if (!beatInterval) {
          // Subtle rhythmic kick roughly at 120 bpm (every 500ms / 1000ms sync)
          beatInterval = setInterval(triggerBeatKick, 1200);
        }
      } else {
        glowContainer.classList.remove("pulse-beat", "beat-kick");
        glowContainer.classList.add("pulse-idle");
        if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
      }
    }

    // IPC integration with main process
    if (window.island) {
      if (window.island.onGlowConfig) {
        window.island.onGlowConfig(config => updateState(config));
      }
      if (window.island.getGlowConfig) {
        window.island.getGlowConfig().then(config => updateState(config));
      }
      if (window.island.onAccentColor) {
        window.island.onAccentColor(color => {
          currentAccent = color;
          applyGlowTheme();
        });
      }
      if (window.island.onState) {
        window.island.onState(state => {
          if (!state) return;
          const wasPlaying = isPlaying;
          isPlaying = !!(state.playing && state.type !== "none");
          if (state.title && sleepHudText) {
            sleepHudText.textContent = `${state.title}${state.artist ? ` • ${state.artist}` : ""} (Playing)`;
          }
          if (wasPlaying !== isPlaying) {
            updateAnimationState();
          }
        });
      }
    }

    // Wake from sleep blackout if user clicks anywhere or presses any key
    window.addEventListener("pointerdown", () => {
      if (glowConfig.sleepBlackout && window.island && window.island.cmd) {
        window.island.cmd("setGlowSleepBlackout", false);
      }
    });

    window.addEventListener("keydown", () => {
      if (glowConfig.sleepBlackout && window.island && window.island.cmd) {
        window.island.cmd("setGlowSleepBlackout", false);
      }
    });
  </script>
</body>
</html>

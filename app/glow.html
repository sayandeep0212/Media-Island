<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media Island Neon Edge Glow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Ambient Blackout / Screen Sleep Layer */
    #blackoutLayer {
      position: fixed;
      inset: 0;
      background: transparent;
      opacity: 0;
      transition: opacity 400ms ease;
      z-index: 1;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
    }

    #blackoutLayer.active {
      background: #000000;
      opacity: 1;
    }

    /* Blackout Sleep Info HUD (faintly appears in dark mode) */
    .sleep-hud {
      position: absolute;
      bottom: 24px;
      right: 28px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 400ms ease;
      z-index: 5;
    }

    #blackoutLayer.active .sleep-hud {
      opacity: 1;
    }

    .sleep-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--glow-accent, #00f0ff);
      box-shadow: 0 0 6px var(--glow-accent, #00f0ff);
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Neon Perimeter Edge Glow Container */
    #glowContainer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      display: none;
      transition: opacity 350ms ease;
      will-change: opacity;
      transform: translateZ(0);
    }

    #glowContainer.enabled {
      display: block;
      opacity: 1;
    }

    /* Core edge lighting layers - Optimized GPU gradient falloff */
    .edge {
      position: absolute;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
    }

    /* Top Edge */
    .edge-top {
      top: 0;
      left: 0;
      right: 0;
      height: var(--glow-depth, 65px);
      background: linear-gradient(to bottom,
        var(--edge-top-color, rgba(0, 240, 255, 0.95)) 0%,
        var(--edge-top-mid, rgba(0, 240, 255, 0.45)) 35%,
        var(--edge-top-faint, rgba(0, 240, 255, 0.12)) 70%,
        transparent 100%
      );
    }

    /* Bottom Edge */
    .edge-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--glow-depth, 65px);
      background: linear-gradient(to top,
        var(--edge-bottom-color, rgba(255, 140, 0, 0.95)) 0%,
        var(--edge-bottom-mid, rgba(255, 140, 0, 0.45)) 35%,
        var(--edge-bottom-faint, rgba(255, 140, 0, 0.12)) 70%,
        transparent 100%
      );
    }

    /* Left Edge */
    .edge-left {
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--glow-depth, 65px);
      background: linear-gradient(to right,
        var(--edge-left-color, rgba(181, 55, 242, 0.95)) 0%,
        var(--edge-left-mid, rgba(181, 55, 242, 0.45)) 35%,
        var(--edge-left-faint, rgba(181, 55, 242, 0.12)) 70%,
        transparent 100%
      );
    }

    /* Right Edge */
    .edge-right {
      top: 0;
      bottom: 0;
      right: 0;
      width: var(--glow-depth, 65px);
      background: linear-gradient(to left,
        var(--edge-right-color, rgba(0, 210, 255, 0.95)) 0%,
        var(--edge-right-mid, rgba(0, 210, 255, 0.45)) 35%,
        var(--edge-right-faint, rgba(0, 210, 255, 0.12)) 70%,
        transparent 100%
      );
    }

    /* Thin perimeter border line with soft inset glow */
    .edge-border-line {
      position: absolute;
      inset: 0;
      border: 2.5px solid transparent;
      border-image-slice: 1;
      border-image-source: var(--border-gradient, linear-gradient(135deg, #9b51e0 0%, #00f0ff 30%, #0070f3 55%, #ff8a3d 80%, #ff2a6d 100%));
      box-shadow: var(--edge-box-shadow, inset 0 0 18px rgba(0, 240, 255, 0.4));
      will-change: opacity;
      transform: translateZ(0);
    }

    /* Music Beat Pulse Animation - 100% GPU Opacity Only (Zero CPU/Layout reflow) */
    .pulse-beat {
      animation: beatPulse 1.6s infinite ease-in-out;
    }

    @keyframes beatPulse {
      0%, 100% {
        opacity: calc(var(--base-opacity, 0.85) * 0.6);
      }
      35% {
        opacity: var(--base-opacity, 0.85);
      }
      65% {
        opacity: calc(var(--base-opacity, 0.85) * 0.75);
      }
      85% {
        opacity: calc(var(--base-opacity, 0.85) * 0.92);
      }
    }

    /* Gentle Breathing when music is paused */
    .pulse-idle {
      animation: breatheSmooth 5s infinite ease-in-out;
    }

    @keyframes breatheSmooth {
      0%, 100% {
        opacity: calc(var(--base-opacity, 0.85) * 0.35);
      }
      50% {
        opacity: calc(var(--base-opacity, 0.85) * 0.7);
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Screen Sleep / Blackout Backdrop -->
  <div id="blackoutLayer">
    <div class="sleep-hud">
      <span class="sleep-dot"></span>
      <span id="sleepHudText">Ambient Sleep Glow • Music Playing</span>
    </div>
  </div>

  <!-- Fullscreen Neon Perimeter Glow -->
  <div id="glowContainer">
    <div class="edge edge-top"></div>
    <div class="edge edge-bottom"></div>
    <div class="edge edge-left"></div>
    <div class="edge edge-right"></div>
    <div class="edge-border-line"></div>
  </div>

  <script>
    const blackoutLayer = document.getElementById("blackoutLayer");
    const glowContainer = document.getElementById("glowContainer");
    const sleepHudText = document.getElementById("sleepHudText");

    let glowConfig = {
      enabled: false,
      mode: "aurora",
      customColor: "#00f0ff",
      brightness: 100,
      sleepBlackout: false
    };

    let currentAccent = "#00f0ff";
    let isPlaying = false;

    function hexToRgba(hex, alpha) {
      hex = hex.replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
      const num = parseInt(hex, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Apply color schemes efficiently using multi-stop linear gradients
    function applyGlowTheme() {
      const mode = glowConfig.mode || "aurora";
      const brightness = (glowConfig.brightness || 100) / 100;
      glowContainer.style.setProperty("--base-opacity", String(0.9 * brightness));

      if (mode === "aurora") {
        // Matches the uploaded photo: Cyan/Blue top-right, Purple/Magenta top-left, Orange/Gold bottom
        glowContainer.style.setProperty("--edge-top-color", `rgba(0, 240, 255, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-top-mid", `rgba(0, 240, 255, ${0.45 * brightness})`);
        glowContainer.style.setProperty("--edge-top-faint", `rgba(0, 240, 255, ${0.12 * brightness})`);

        glowContainer.style.setProperty("--edge-right-color", `rgba(0, 210, 255, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-right-mid", `rgba(0, 210, 255, ${0.45 * brightness})`);
        glowContainer.style.setProperty("--edge-right-faint", `rgba(0, 210, 255, ${0.12 * brightness})`);

        glowContainer.style.setProperty("--edge-left-color", `rgba(181, 55, 242, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-left-mid", `rgba(181, 55, 242, ${0.45 * brightness})`);
        glowContainer.style.setProperty("--edge-left-faint", `rgba(181, 55, 242, ${0.12 * brightness})`);

        glowContainer.style.setProperty("--edge-bottom-color", `rgba(255, 140, 0, ${0.95 * brightness})`);
        glowContainer.style.setProperty("--edge-bottom-mid", `rgba(255, 140, 0, ${0.45 * brightness})`);
        glowContainer.style.setProperty("--edge-bottom-faint", `rgba(255, 140, 0, ${0.12 * brightness})`);

        glowContainer.style.setProperty("--border-gradient", "linear-gradient(135deg, #9b51e0 0%, #00f0ff 30%, #0070f3 55%, #ff8a3d 80%, #ff2a6d 100%)");
        glowContainer.style.setProperty("--edge-box-shadow", `inset 0 0 24px rgba(0, 240, 255, ${0.5 * brightness})`);
        document.documentElement.style.setProperty("--glow-accent", "#00f0ff");
      } else {
        let baseColor = currentAccent;
        if (mode === "cyan") baseColor = "#00f0ff";
        else if (mode === "pink") baseColor = "#ff2a6d";
        else if (mode === "sunset") baseColor = "#ff8a3d";
        else if (mode === "emerald") baseColor = "#05ffa1";
        else if (mode === "purple") baseColor = "#b537f2";
        else if (mode === "custom" && glowConfig.customColor) baseColor = glowConfig.customColor;

        const solid = hexToRgba(baseColor, 0.95 * brightness);
        const mid = hexToRgba(baseColor, 0.42 * brightness);
        const faint = hexToRgba(baseColor, 0.12 * brightness);

        glowContainer.style.setProperty("--edge-top-color", solid);
        glowContainer.style.setProperty("--edge-top-mid", mid);
        glowContainer.style.setProperty("--edge-top-faint", faint);

        glowContainer.style.setProperty("--edge-right-color", solid);
        glowContainer.style.setProperty("--edge-right-mid", mid);
        glowContainer.style.setProperty("--edge-right-faint", faint);

        glowContainer.style.setProperty("--edge-left-color", solid);
        glowContainer.style.setProperty("--edge-left-mid", mid);
        glowContainer.style.setProperty("--edge-left-faint", faint);

        glowContainer.style.setProperty("--edge-bottom-color", solid);
        glowContainer.style.setProperty("--edge-bottom-mid", mid);
        glowContainer.style.setProperty("--edge-bottom-faint", faint);

        glowContainer.style.setProperty("--border-gradient", `linear-gradient(135deg, ${baseColor} 0%, #ffffff 50%, ${baseColor} 100%)`);
        glowContainer.style.setProperty("--edge-box-shadow", `inset 0 0 24px ${hexToRgba(baseColor, 0.45 * brightness)}`);
        document.documentElement.style.setProperty("--glow-accent", baseColor);
      }
    }

    function updateState(config) {
      if (!config) return;
      glowConfig = Object.assign(glowConfig, config);

      if (glowConfig.enabled) {
        glowContainer.classList.add("enabled");
      } else {
        glowContainer.classList.remove("enabled");
      }

      if (glowConfig.sleepBlackout) {
        blackoutLayer.classList.add("active");
      } else {
        blackoutLayer.classList.remove("active");
      }

      applyGlowTheme();
      updateAnimationState();
    }

    function updateAnimationState() {
      if (!glowConfig.enabled) {
        glowContainer.classList.remove("pulse-beat", "pulse-idle");
        return;
      }

      if (isPlaying) {
        glowContainer.classList.remove("pulse-idle");
        glowContainer.classList.add("pulse-beat");
      } else {
        glowContainer.classList.remove("pulse-beat");
        glowContainer.classList.add("pulse-idle");
      }
    }

    // IPC integration with main process
    if (window.island) {
      if (window.island.onGlowConfig) {
        window.island.onGlowConfig(config => updateState(config));
      }
      if (window.island.getGlowConfig) {
        window.island.getGlowConfig().then(config => updateState(config));
      }
      if (window.island.onAccentColor) {
        window.island.onAccentColor(color => {
          currentAccent = color;
          applyGlowTheme();
        });
      }
      if (window.island.onState) {
        window.island.onState(state => {
          if (!state) return;
          const wasPlaying = isPlaying;
          isPlaying = !!(state.playing && state.type !== "none");
          if (state.title && sleepHudText) {
            sleepHudText.textContent = `${state.title}${state.artist ? ` • ${state.artist}` : ""} (Playing)`;
          }
          if (wasPlaying !== isPlaying) {
            updateAnimationState();
          }
        });
      }
    }

    // Wake from sleep blackout if user clicks anywhere or presses any key
    window.addEventListener("pointerdown", () => {
      if (glowConfig.sleepBlackout && window.island && window.island.cmd) {
        window.island.cmd("setGlowSleepBlackout", false);
      }
    });

    window.addEventListener("keydown", () => {
      if (glowConfig.sleepBlackout && window.island && window.island.cmd) {
        window.island.cmd("setGlowSleepBlackout", false);
      }
    });
  </script>
</body>
</html>

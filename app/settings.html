<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Island Settings</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #171717; color: #f5f5f5; }
  body { margin: 0; padding: 28px; }
  h1 { margin: 0 0 8px; font-size: 21px; }
  p { margin: 0; color: #aaa; font-size: 13px; line-height: 1.5; }
  .picker { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; padding: 16px; border: 1px solid #333; border-radius: 12px; }
  label { font-size: 14px; font-weight: 600; }
  input { width: 48px; height: 38px; padding: 2px; border: 1px solid #555; border-radius: 8px; background: transparent; cursor: pointer; }
  #status { min-height: 18px; margin-top: 12px; color: #aaa; font-size: 12px; }
</style>
</head>
<body>
  <h1>Media Island</h1>
  <p>Personalize the accent color used by the island's waveform and controls.</p>
  <div class="picker">
    <label for="accent">Accent color</label>
    <input id="accent" type="color" aria-label="Choose accent color">
  </div>
  <div id="status" role="status"></div>
  <script>
    const picker = document.getElementById("accent");
    const status = document.getElementById("status");
    window.island.getAccentColor().then(color => { picker.value = color; });
    picker.addEventListener("input", async () => {
      try {
        await window.island.setAccentColor(picker.value);
        status.textContent = "Color saved.";
      } catch (error) {
        status.textContent = `Couldn't save color: ${error.message}`;
      }
    });
  </script>
</body>
</html>

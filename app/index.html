<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --accent: #ff8a3d; }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: -apple-system, "Segoe UI", sans-serif; user-select: none; }
  #wrap { width: 560px; height: 190px; display: flex; justify-content: center; align-items: flex-start; }
  #pill {
    margin-top: 2px; width: 244px; height: 42px; box-sizing: border-box;
    background: #000; border: 1px solid #202020; border-radius: 999px;
    display: flex; align-items: center; padding: 5px 14px 5px 5px; color: #fff;
    transform: scale(0); opacity: 0; transform-origin: top center;
    transition: width .35s cubic-bezier(.3,1.3,.5,1), height .35s cubic-bezier(.3,1.3,.5,1), border-radius .35s, transform .35s, opacity .25s, padding .35s;
  }
  #pill.show { transform: scale(1); opacity: 1; }
  #pill { cursor: grab; }
  #pill.dragging { cursor: grabbing; }
  #pill.open { width: 520px; height: 154px; border-radius: 48px; padding: 14px 22px; flex-direction: column; align-items: stretch; }
  #topline { display: flex; align-items: center; width: 100%; min-height: 32px; box-sizing: border-box; }
  #pill.open #topline { min-height: 54px; }
  #art { position: relative; width: 30px; height: 30px; border-radius: 9px; background: #222 center/cover; flex: none; transition: all .35s; }
  #pill.open #art { width: 54px; height: 54px; border-radius: 15px; }
  #source-badge { position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; box-sizing: border-box; overflow: hidden; display: grid; place-items: center; border: 2px solid #000; border-radius: 50%; background: #333; color: #fff; font-size: 9px; font-weight: 700; }
  #source-icon { width: 100%; height: 100%; object-fit: cover; }
  #source-fallback { display: none; text-transform: uppercase; }
  #info { display: none; min-width: 0; margin: 0 12px; opacity: 0; width: 0; transition: opacity .25s; }
  #pill.open #info { display: block; flex: 1; opacity: 1; width: auto; }
  #title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 13px; color: #9a9a9a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  #wave { display: flex; align-items: center; gap: 3px; height: 22px; flex: none; margin-left: 10px; }
  #pill.open #wave { margin-left: 0; }
  #wave i { display: block; width: 3px; border-radius: 3px; background: var(--accent); height: 6px; }
  #pill.playing #wave i { animation: bar .9s ease-in-out infinite; }
  #wave i:nth-child(1) { animation-delay: -.7s } #wave i:nth-child(2) { animation-delay: -.3s }
  #wave i:nth-child(3) { animation-delay: -.5s } #wave i:nth-child(4) { animation-delay: -.1s }
  #wave i:nth-child(5) { animation-delay: -.6s }
  #sticker-box {
    width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-left: auto; position: relative; user-select: none; -webkit-user-drag: none;
    perspective: 600px;
  }
  #pill.open #sticker-box { margin-left: 12px; }
  #sticker-box svg {
    width: 100% !important; height: 100% !important; display: block !important;
    transform-origin: center center !important;
    transform: var(--sticker-offset, translate(0, 0)) var(--sticker-tilt, rotate(0deg)) perspective(600px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
    transition: transform 350ms cubic-bezier(0.34, 1.56, 0.64, 1), filter 350ms cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: auto;
  }
  #sticker-box:hover svg {
    transform: var(--sticker-offset, translate(0, 0)) var(--sticker-tilt, rotate(0deg)) perspective(600px) rotateX(12deg) rotateY(-12deg) translateY(-3px) scale(1.15);
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.6));
  }
  #sticker-box:active svg {
    transform: var(--sticker-offset, translate(0, 0)) var(--sticker-tilt, rotate(0deg)) scale(0.92);
    transition: transform 100ms ease;
  }
  @keyframes stickerSlap {
    0% { transform: scale(0.4) rotate(-15deg); opacity: 0; }
    60% { transform: scale(1.18) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .sticker-slap svg {
    animation: stickerSlap 380ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  #phone-btn { display: none; width: 28px; height: 28px; margin-left: 10px; border: 0; border-radius: 50%; background: #222; color: #a5a5a5; cursor: pointer; align-items: center; justify-content: center; transition: all .2s; }
  #pill.open #phone-btn { display: flex; }
  #phone-btn:hover { color: #fff; background: #383838; }
  #close { display: none; width: 28px; height: 28px; margin-left: 6px; border: 0; border-radius: 50%; background: #222; color: #a5a5a5; cursor: pointer; align-items: center; justify-content: center; transition: all .2s; }
  #pill.open #close { display: flex; }
  #close:hover { color: #fff; background: #383838; }
  #progress-row { display: none; align-items: center; gap: 10px; margin: 4px 1px 0; color: #a5a5a5; font-size: 11px; font-variant-numeric: tabular-nums; }
  #pill.open #progress-row { display: flex; }
  #progress { appearance: none; flex: 1; min-width: 0; height: 5px; border-radius: 99px; outline: none; cursor: pointer; background: linear-gradient(to right, var(--accent) var(--progress, 0%), #333 var(--progress, 0%)); }
  #progress::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  #ctrls { display: none; justify-content: center; align-items: center; gap: 26px; margin-top: 6px; }
  #pill.open #ctrls { display: flex; }
  #ctrls button { background: none; border: 0; color: #fff; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: transform .15s ease, color .15s ease, background .15s ease; }
  #ctrls button:hover { color: var(--accent); transform: scale(1.15); }
  #ctrls button:active { transform: scale(0.92); }
  #ctrls #pp { width: 38px; height: 38px; background: rgba(255, 255, 255, 0.12); border-radius: 50%; }
  #ctrls #pp:hover { background: rgba(255, 255, 255, 0.22); color: #fff; }
  @keyframes bar { 0%,100% { height: 6px } 50% { height: 22px } }
</style>
</head>
<body>
<div id="wrap">
  <div id="pill">
    <div id="topline">
      <div id="art">
        <span id="source-badge" title="Media source" aria-label="Media source">
          <img id="source-icon" alt="">
          <span id="source-fallback"></span>
        </span>
      </div>
      <div id="info">
        <div id="title"></div>
        <div id="artist"></div>
      </div>
      <div id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="sticker-box" class="sticker-peel" role="button" tabindex="0" title="Click to change sticker"></div>
      <button id="phone-btn" aria-label="Phone Remote & QR Pairing" title="Show Phone Remote QR Code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3z"/><path d="M20 14v.01"/><path d="M14 20v.01"/><path d="M17 17v3"/><path d="M20 17v3"/></svg>
      </button>
      <button id="close" aria-label="Close Media Island" title="Close Media Island">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="progress-row">
      <span id="elapsed">0:00</span>
      <input id="progress" aria-label="Seek through media" type="range" min="0" max="100" value="0">
      <span id="remaining">-0:00</span>
    </div>
    <div id="ctrls">
      <button id="prev" aria-label="Previous track" title="Previous">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 6.82 7.04 4.88c.67.46 1.58-.02 1.58-.82V7.12c0-.8-.91-1.28-1.58-.82l-7.04 4.88c-.46.32-.46 1 0 1.64z"/></svg>
      </button>
      <button id="pp" aria-label="Play or pause" title="Play or pause">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/></svg>
      </button>
      <button id="next" aria-label="Next track" title="Next">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M17 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zM5.72 6.3c-.67-.46-1.58.02-1.58.82v9.76c0 .8.91 1.28 1.58.82l7.04-4.88c.46-.32.46-1 0-1.64L5.72 6.3z"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
  const pill = document.getElementById("pill");
  const $ = id => document.getElementById(id);
  let duration = 0;
  let currentTrack = "";
  let dismissedTrack = "";
  let dragging = false;
  const formatTime = seconds => {
    const total = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
  };
  const setAccent = color => document.documentElement.style.setProperty("--accent", color);
  $("source-icon").addEventListener("error", () => {
    $("source-icon").style.display = "none";
    $("source-fallback").style.display = "block";
  });

  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/></svg>';
  const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1zm8 0c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1z"/></svg>';

  window.island.getAccentColor().then(setAccent);
  window.island.onAccentColor(setAccent);
  window.island.onState(s => {
    if (s.type === "none") { pill.classList.remove("show", "open", "playing"); return; }
    const track = JSON.stringify([s.title || "", s.artist || "", s.art || ""]);
    if (track !== currentTrack) {
      currentTrack = track;
      if (track !== dismissedTrack) dismissedTrack = "";
      if (window.changeIslandSticker) window.changeIslandSticker();
    }
    pill.classList.toggle("show", track !== dismissedTrack);
    const isPlaying = !!s.playing;
    pill.classList.toggle("playing", isPlaying);
    $("pp").innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    $("pp").setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    $("pp").setAttribute("title", isPlaying ? "Pause" : "Play");
    $("title").textContent = s.title || "";
    $("artist").textContent = s.artist || "";
    $("art").style.backgroundImage = s.art ? `url("${s.art}")` : "none";
    const sourceName = s.sourceName || "Unknown source";
    const sourceIcon = s.sourceIcon || "";
    $("source-badge").title = sourceName;
    $("source-badge").setAttribute("aria-label", `Playing from ${sourceName}`);
    $("source-fallback").textContent = sourceName.charAt(0) || "?";
    if ($("source-icon").dataset.sourceIcon !== sourceIcon) {
      $("source-icon").dataset.sourceIcon = sourceIcon;
      $("source-icon").style.display = sourceIcon ? "block" : "none";
      $("source-fallback").style.display = sourceIcon ? "none" : "block";
      if (sourceIcon) $("source-icon").src = sourceIcon;
      else $("source-icon").removeAttribute("src");
    }
    duration = Number.isFinite(s.duration) && s.duration > 0 ? s.duration : 0;
    const current = Number.isFinite(s.currentTime) ? s.currentTime : 0;
    const percent = duration ? Math.min(100, Math.max(0, current / duration * 100)) : 0;
    $("progress").max = duration || 100;
    $("progress").value = duration ? current : 0;
    $("progress").style.setProperty("--progress", `${percent}%`);
    $("elapsed").textContent = formatTime(current);
    $("remaining").textContent = `-${formatTime(Math.max(0, duration - current))}`;
  });
  pill.addEventListener("mouseenter", () => { window.island.interactive(true); pill.classList.add("open"); });
  pill.addEventListener("mouseleave", () => {
    if (!dragging) { pill.classList.remove("open"); window.island.interactive(false); }
  });
  pill.addEventListener("pointerdown", event => {
    if (event.target.closest("button, input, #sticker-box")) return;
    dragging = true;
    pill.classList.add("dragging");
    pill.setPointerCapture(event.pointerId);
    window.island.drag("start", event.screenX, event.screenY);
  });
  pill.addEventListener("pointermove", event => {
    if (dragging) window.island.drag("move", event.screenX, event.screenY);
  });
  const endDrag = event => {
    if (!dragging) return;
    dragging = false;
    pill.classList.remove("dragging");
    window.island.drag("end", event.screenX, event.screenY);
  };
  pill.addEventListener("pointerup", endDrag);
  pill.addEventListener("pointercancel", endDrag);
  $("phone-btn").addEventListener("click", event => {
    event.stopPropagation();
    window.island.openSettings("tab-remote");
  });
  $("close").addEventListener("click", event => {
    event.stopPropagation();
    dismissedTrack = currentTrack;
    pill.classList.remove("show", "open", "playing");
    window.island.interactive(false);
  });
  $("pp").onclick = () => window.island.cmd("playpause");
  $("next").onclick = () => window.island.cmd("next");
  $("prev").onclick = () => window.island.cmd("prev");
  $("progress").addEventListener("change", event => window.island.cmd("seek", Number(event.target.value)));
  $("progress").addEventListener("input", event => {
    const current = Number(event.target.value);
    const percent = duration ? current / duration * 100 : 0;
    event.target.style.setProperty("--progress", `${percent}%`);
    $("elapsed").textContent = formatTime(current);
    $("remaining").textContent = `-${formatTime(Math.max(0, duration - current))}`;
  });
</script>
<script src="stickers.js"></script>
</body>
</html>

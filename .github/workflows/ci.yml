name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Code & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci || npm install --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Validate JavaScript Syntax
        run: |
          node -c app/main.js
          node -c app/preload.js
          node -c app/stickers.js
          node -c app/firebase-sync.js
          node -c mobile/app.js
          node -c mobile/stickers-data.js
          node -c extension/background.js
          node -c extension/content.js

      - name: Verify Stickers Generator
        run: node scripts/generate-stickers.js

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Sync Mobile Assets
        shell: pwsh
        run: |
          if (-not (Test-Path app/mobile)) {
            Copy-Item -Recurse -Force mobile app/mobile
          }

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci || npm install --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Pre-seed Electron Binary Cache
        shell: pwsh
        run: |
          $cacheDir = "$env:LOCALAPPDATA/electron/Cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $target = "$cacheDir/electron-v33.4.11-win32-x64.zip"
          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 50000000) {
            Write-Host "Pre-seeding Electron binary from high-speed mirror to avoid GitHub 504 timeouts..."
            Invoke-WebRequest -Uri "https://cdn.npmmirror.com/binaries/electron/v33.4.11/electron-v33.4.11-win32-x64.zip" -OutFile $target
          }

      - name: Build Windows Installer
        working-directory: ./app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-island-windows-build
          path: app/release/*.exe
          retention-days: 7

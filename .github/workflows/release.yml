name: Release CI/CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install root dependencies & build stickers
        shell: pwsh
        run: |
          npm ci || npm install --no-audit
          npm run generate-stickers

      - name: Sync Mobile Remote Assets to App
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force mobile app/mobile

      - name: Package Chrome Extension
        shell: pwsh
        run: |
          tar -a -c -f media-island-extension.zip -C extension .

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci || npm install --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Pre-seed Electron & NSIS Binary Caches
        shell: pwsh
        run: |
          $electronCache = "$env:LOCALAPPDATA/electron/Cache"
          New-Item -ItemType Directory -Force -Path $electronCache | Out-Null
          $targetElectron = "$electronCache/electron-v33.4.11-win32-x64.zip"
          if (-not (Test-Path $targetElectron) -or (Get-Item $targetElectron).Length -lt 50000000) {
            Write-Host "Pre-seeding Electron binary from high-speed mirror to avoid GitHub 504 timeouts..."
            Invoke-WebRequest -Uri "https://cdn.npmmirror.com/binaries/electron/v33.4.11/electron-v33.4.11-win32-x64.zip" -OutFile $targetElectron
          }

          $nsisCache = "$env:LOCALAPPDATA/electron-builder/Cache/nsis"
          New-Item -ItemType Directory -Force -Path $nsisCache | Out-Null
          $nsisResource = "$nsisCache/nsis-resources-3.4.1.7z"
          if (-not (Test-Path $nsisResource) -or (Get-Item $nsisResource).Length -lt 10000) {
            Write-Host "Pre-seeding NSIS resources from mirror..."
            Invoke-WebRequest -Uri "https://cdn.npmmirror.com/binaries/electron-builder-binaries/nsis-resources-3.4.1/nsis-resources-3.4.1.7z" -OutFile $nsisResource
          }
          $nsisBin = "$nsisCache/nsis-3.0.4.1.7z"
          if (-not (Test-Path $nsisBin) -or (Get-Item $nsisBin).Length -lt 10000) {
            Write-Host "Pre-seeding NSIS binary from mirror..."
            Invoke-WebRequest -Uri "https://cdn.npmmirror.com/binaries/electron-builder-binaries/nsis-3.0.4.1/nsis-3.0.4.1.7z" -OutFile $nsisBin
          }

      - name: Build Windows Installer
        working-directory: ./app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Determine Tag Name
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event.inputs.tag_name }}" -ne "") {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          if ($tag -eq "" -or $tag -eq "main" -or $tag -eq "master") {
            $tag = "v1.1.0"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Media Island ${{ steps.vars.outputs.tag }} – Dynamic Island & Mobile Remote
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/release/*.exe
            app/release/*.blockmap
            media-island-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
